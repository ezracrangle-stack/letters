  - id: emeth
    name: Andrew Carreon
    firm: Emeth Value Capital
    style: "Concentrated value with a quality tilt: a handful of deeply mispriced stocks."
    why: "A one-person shop in New Orleans running about five positions. With a book that tight, every letter has to defend each name in detail."
    best_for: "Concentrated investors who want to see a small portfolio defended name by name."
    letters_page: https://www.emethvaluecapital.com/letters-1
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      label: context            # the date is the caption under each cover image

  - id: laughing-water
    name: Matthew Sweeney
    firm: Laughing Water Capital
    style: "Concentrated small caps (8 to 20 names) working through a fixable problem, held 3 to 5 years."
    why: "Matt runs every idea through four questions before he looks at price, and the last one is \"what happens when something goes wrong?\" His letters show that discipline in the quarters when it hurts."
    best_for: "Small-cap investors who buy good businesses in the middle of a fixable problem."
    letters_page: https://www.laughingwatercapital.com/letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      exclude: 'vail|lp meeting|moi|graham|interview|brunch|vii|top idea|transcript|quant'
    overrides:
      - match: "March-2020-Interim"
        title: "March 2020 interim update"

  - id: maran
    name: Dan Roller
    firm: Maran Capital
    style: "Concentrated value in off-the-radar small caps, often buy-and-build compounders."
    why: "Dan hunts where few people look: illiquid, out-of-favor, broken IPOs. He also writes about how not to fool yourself (checklists, pre-mortems, being a fallibilist)."
    best_for: "Special situations investors."
    letters_page: https://marancapital.com/insights
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      exclude: 'decade|excerpt|terms|privacy'
    overrides:
      - match: "Founders-Letter"
        title: "Founder's letter"

  - id: greenhaven
    name: Scott Miller
    firm: Greenhaven Road Capital
    style: "Long-biased, global, off-the-beaten-path ideas, modeled on the early Buffett partnerships."
    why: "Scott writes like he's talking to a friend and he's honest about how much of any record is luck. He also visits companies most investors only read about."
    best_for: "Investors open to off-the-beaten-path ideas anywhere in the world."
    letters_page: https://www.greenhavenroad.com/investor-letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: url
    overrides:                  # the firm runs two funds; mark the second one
      - match: "partners.?fund|prtners"
        title: "{label} · Partners Fund"

  - id: saga
    name: Joe Frankenfield
    firm: Saga Partners
    style: "Concentrated compounders bought when the market doubts them; calls himself a value investor who owns growth."
    why: "Joe breaks down the unit economics of names like Carvana and The Trade Desk in more depth than most sell-side reports, and he writes openly about his mistakes."
    best_for: "Investors who want to understand fast-growing businesses through their unit economics."
    letters_page: https://www.sagapartners.com/investorletters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      exclude: 'best way|factsheet'
    overrides:
      - match: "07ee41b5ab5f4496917774595a979845"
        title: "The Growth of Knowledge (Aug 2026)"

  - id: greystone
    name: Adam Wilk
    firm: Greystone Capital
    style: "Concentrated small and micro caps run by trustworthy managers, held for years."
    why: "Adam uses his letters as a filter for new partners, so he writes them for people who think in years. A good source of under-followed small caps you won't find on a screen."
    best_for: "Small and micro-cap investors with a multi-year horizon."
    letters_page: https://www.greystonecapitalfund.com/letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text

  - id: crossroads
    name: Ryan O'Connor
    firm: Crossroads Capital
    style: "Undiscovered emerging franchises plus catalyst-driven special situations, in the Buffett partnership tradition."
    why: "Ryan's grandfather put the family savings into Buffett's early partnership, and Ryan runs Crossroads in that spirit. His Nintendo work is a lesson in finding hidden assets."
    best_for: "Special situations investors and anyone hunting under-followed small caps."
    letters_page: https://www.crossroadscap.io/investor-portal-home
    access: open
    scrape:
      select: 'a[href*="/investor-letters/"]'
      url_attr: href
      period_from: url

  - id: semper-augustus
    name: Chris Bloomstran
    firm: Semper Augustus
    style: "Concentrated portfolio of well-run, well-capitalized businesses bought below conservative appraisals."
    why: "One letter a year, often 100+ pages, with the Berkshire Hathaway valuation serious Berkshire watchers wait for. Block an afternoon."
    best_for: "Berkshire Hathaway shareholders and anyone who thinks about market valuation over decades."
    letters_page: https://www.semperaugustus.com/clientletter
    access: open
    scrape:
      select: 'a[href*="fmgsuite.com/media/documents"]'
      url_attr: href
      period_from: text
      title_from_text: true     # Chris's letters have real titles; show them

  - id: fundsmith
    name: Terry Smith
    firm: Fundsmith
    style: "Global quality: buy good companies, don't overpay, do nothing."
    why: "Terry's annual letter is short, funny and blunt, and he defends the strategy hardest in the years it isn't working."
    best_for: "Quality investors who buy great companies and hold them."
    letters_page: https://www.fundsmith.co.uk/documents/
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      include: 'letter to shareholders'
    overrides:
      - match: "annual-letter"
        title: "Annual letter"
      - match: "semi-annual"
        title: "Semi-annual letter"
      - match: "2020-3-fef-letter"
        period: Q1 2020
        title: "March 2020 letter"

  - id: turtle-creek
    name: Andrew Brenton
    firm: Turtle Creek Asset Management
    style: "Private-equity mindset in public mid caps: 25 to 30 names, position sizes moved as value changes (\"buy and optimize\")."
    why: "Turtle Creek has compounded since 1998 doing something closer to private equity than classic value. Andrew explains why trimming and adding around intrinsic value beats plain buy-and-hold."
    best_for: "Mid-cap investors curious about a private-equity approach to public markets."
    letters_page: https://www.turtlecreek.ca/communications/
    access: registration
    access_note: "Turtle Creek shows its letters on its own site after you confirm you live in Canada or outside the United States."
    access_meta: "Letters on the firm's site after a residency check"

