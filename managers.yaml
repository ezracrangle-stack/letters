  - id: emeth
    name: Andrew Carreon
    firm: Emeth Value Capital
    style: "Concentrated value with a quality tilt: a handful of deeply mispriced stocks."
    why: "A one-person shop in New Orleans running about five positions. With a book that tight, every letter has to defend each name in detail."
    best_for: "Concentrated investors who want to see a small portfolio defended name by name."
    letters_page: https://www.emethvaluecapital.com/letters-1
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      label: context            # the date is the caption under each cover image

  - id: laughing-water
    name: Matthew Sweeney
    firm: Laughing Water Capital
    style: "Concentrated small caps (8 to 20 names) working through a fixable problem, held 3 to 5 years."
    why: "Matt runs every idea through four questions before he looks at price, and the last one is \"what happens when something goes wrong?\" His letters show that discipline in the quarters when it hurts."
    best_for: "Small-cap investors who buy good businesses in the middle of a fixable problem."
    letters_page: https://www.laughingwatercapital.com/letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      exclude: 'vail|lp meeting|moi|graham|interview|brunch|vii|top idea|transcript|quant'
    overrides:
      - match: "March-2020-Interim"
        title: "March 2020 interim update"

  - id: maran
    name: Dan Roller
    firm: Maran Capital
    style: "Concentrated value in off-the-radar small caps, often buy-and-build compounders."
    why: "Dan hunts where few people look: illiquid, out-of-favor, broken IPOs. He also writes about how not to fool yourself (checklists, pre-mortems, being a fallibilist)."
    best_for: "Special situations investors."
    letters_page: https://marancapital.com/insights
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      exclude: 'decade|excerpt|terms|privacy'
    overrides:
      - match: "Founders-Letter"
        title: "Founder's letter"

  - id: greenhaven
    name: Scott Miller
    firm: Greenhaven Road Capital
    style: "Long-biased, global, off-the-beaten-path ideas, modeled on the early Buffett partnerships."
    why: "Scott writes like he's talking to a friend and he's honest about how much of any record is luck. He also visits companies most investors only read about."
    best_for: "Investors open to off-the-beaten-path ideas anywhere in the world."
    letters_page: https://www.greenhavenroad.com/investor-letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: url
    overrides:                  # the firm runs two funds; mark the second one
      - match: "partners.?fund|prtners"
        title: "{label} · Partners Fund"

  - id: saga
    name: Joe Frankenfield
    firm: Saga Partners
    style: "Owns a concentrated portfolio of businesses, often for many years, whose competitive advantages and long-term potential are misunderstood or underappreciated by the market."
    why: "Joe breaks down the unit economics of names like Carvana and The Trade Desk in more depth than most sell-side reports, and he writes openly about his mistakes."
    best_for: "Investors who want to understand fast-growing businesses through their unit economics."
    letters_page: https://www.sagapartners.com/investorletters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      exclude: 'best way|factsheet'
    overrides:
      - match: "07ee41b5ab5f4496917774595a979845"
        title: "The Growth of Knowledge (Aug 2026)"

  - id: greystone
    name: Adam Wilk
    firm: Greystone Capital
    style: "Concentrated small and micro caps run by trustworthy managers, held for years."
    why: "Adam uses his letters as a filter for new partners, so he writes them for people who think in years. A good source of under-followed small caps you won't find on a screen."
    best_for: "Small and micro-cap investors with a multi-year horizon."
    letters_page: https://www.greystonecapitalfund.com/letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text

  - id: crossroads
    name: Ryan O'Connor
    firm: Crossroads Capital
    style: "Undiscovered emerging franchises plus catalyst-driven special situations, in the Buffett partnership tradition."
    why: "Ryan's grandfather put the family savings into Buffett's early partnership, and Ryan runs Crossroads in that spirit. His Nintendo work is a lesson in finding hidden assets."
    best_for: "Special situations investors and anyone hunting under-followed small caps."
    letters_page: https://www.crossroadscap.io/investor-portal-home
    access: open
    scrape:
      select: 'a[href*="/investor-letters/"]'
      url_attr: href
      period_from: url

  - id: semper-augustus
    name: Chris Bloomstran
    firm: Semper Augustus
    style: "Concentrated portfolio of well-run, well-capitalized businesses bought below conservative appraisals."
    why: "One letter a year, often 100+ pages, with the Berkshire Hathaway valuation serious Berkshire watchers wait for. Block an afternoon."
    best_for: "Berkshire Hathaway shareholders and anyone who thinks about market valuation over decades."
    letters_page: https://www.semperaugustus.com/clientletter
    access: open
    scrape:
      select: 'a[href*="fmgsuite.com/media/documents"]'
      url_attr: href
      period_from: text
      title_from_text: true     # Chris's letters have real titles; show them

  - id: fundsmith
    name: Terry Smith
    firm: Fundsmith
    style: "Global quality: buy good companies, don't overpay, do nothing."
    why: "Terry's annual letter is short, funny and blunt, and he defends the strategy hardest in the years it isn't working."
    best_for: "Quality investors who buy great companies and hold them."
    letters_page: https://www.fundsmith.co.uk/documents/
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      include: 'letter to shareholders'
    overrides:
      - match: "annual-letter"
        title: "Annual letter"
      - match: "semi-annual"
        title: "Semi-annual letter"
      - match: "2020-3-fef-letter"
        period: Q1 2020
        title: "March 2020 letter"

  - id: turtle-creek
    name: Andrew Brenton
    firm: Turtle Creek Asset Management
    style: "Private-equity mindset in public mid caps: 25 to 30 names, position sizes moved as value changes (\"buy and optimize\")."
    why: "Turtle Creek has compounded since 1998 doing something closer to private equity than classic value. Andrew explains why trimming and adding around intrinsic value beats plain buy-and-hold."
    best_for: "Mid-cap investors curious about a private-equity approach to public markets."
    letters_page: https://www.turtlecreek.ca/communications/
    access: registration
    access_note: "Turtle Creek shows its letters on its own site after you confirm you live in Canada or outside the United States."
    access_meta: "Letters on the firm's site after a residency check"

  - id: vltava
    name: Daniel Gladiš
    firm: Vltava Fund
    style: "Global, concentrated portfolio of quality businesses bought at sensible prices."
    why: "Daniel writes essays more than portfolio reports: value traps, the Kelly criterion, skill versus chance. Few letters explain the craft this clearly, and the archive goes back to 2004."
    best_for: "Long-term investors who care more about process than about stock tips."
    letters_page: https://www.vltavafund.com/dopisy-akcionarum
    access: open
    scrape:
      select: 'a[href*="/dopisy-akcionarum/"]'
      url_attr: href
      period_from: text
      title_from_text: true     # each letter has its own title

  - id: horos
    name: Javier Ruiz
    firm: Horos Asset Management
    style: "Contrarian global value from Madrid, mostly in small and mid caps few investors follow."
    why: "Javier is candid about what being contrarian costs and explains each position in plain terms. One of the best value letters coming out of Spain."
    best_for: "Contrarian value investors comfortable owning what others avoid."
    letters_page: https://horosam.com/en/publications/letters-to-co-investors/
    access: open
    scrape:
      select: 'a[href*="horosam.com/en/"]'
      url_attr: href
      period_from: text
      include: 'letter to our'
      partial_page: true        # older letters live on pages 2 to 8; they were loaded once
    letters:
      - {period: Q4 2024, url: "https://horosam.com/en/letter-to-our-coinvestors-4t24/"}
    overrides:
      - match: "annual-letter"
        title: "Annual letter"

  - id: giverny
    name: François Rochon
    firm: Giverny Capital
    style: "Quality businesses with growing earnings, held for years and judged by how their intrinsic value grows."
    why: "François's annual letter tracks the owner earnings of every holding, and every year he reminds partners that trailing the market some years is the price of doing this well."
    best_for: "Quality investors who measure progress by business results, not stock prices."
    letters_page: https://givernycapital.com/en/letters-to-our-partners/
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: url
      partial_page: true        # older letters live on pages 2 and 3; they were loaded once
    overrides:
      - match: "annual-letter"
        title: "Annual letter"

  - id: plural
    name: Chris Waller
    firm: Plural Investing
    style: "Global small-cap value: 7 or 8 \"hidden gems\" held for 3 to 5 years."
    why: "Chris calls his method sleuth investing: he researches small companies like an investigative journalist, and his letters show the work. Longer write-ups live on his Hidden Gems Investing Substack."
    best_for: "Global small-cap investors who like deep primary research."
    letters_page: https://www.pluralinvesting.com/letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: url

  - id: massif
    name: William Thomson
    firm: Massif Capital
    style: "Long/short in liquid real assets: energy, materials and industrial businesses with tangible, long-lived assets."
    why: "Will and Chip write about cycles, bottlenecks and their short book with rare candor. One of the few serious letters on energy, metals and industrials."
    best_for: "Investors in commodities, energy and other real-asset businesses."
    letters_page: https://www.massifcap.com/fund-letters
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: url

  - id: moerus
    name: Amit Wadhwaney
    firm: Moerus Capital Management
    style: "Deep value worldwide, often in emerging markets and out-of-favor industries."
    why: "Amit spent decades at Third Avenue and still hunts where the discounts are widest, often in markets most US funds won't touch."
    best_for: "Deep value investors open to emerging and frontier markets."
    letters_page: https://www.moeruscap.com/shareholder-letters/
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: url
      include: 'letter'
    overrides:
      - match: "annual"
        title: "Annual letter"
      - match: "semi-annual"
        title: "Semi-annual letter"

  - id: hinde
    name: Marc Werres
    firm: Hinde Group
    style: "Concentrated value in a handful of businesses, mostly well-known US large caps, held for years."
    why: "Marc owns six or seven stocks and explains each one at length. You see how a concentrated investor reasons about companies like Alphabet, Netflix, Uber and Interactive Brokers that most people assume are already fairly priced."
    best_for: "Investors who run concentrated portfolios of large-cap compounders."
    letters_page: https://www.hinde-group.com/letters
    access: open
    scrape:
      select: 'a[href*="Partner-Letter"]'
      url_attr: href
      period_from: text

