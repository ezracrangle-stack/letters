# ─────────────────────────────────────────────────────────────
#  EZRA'S NOTES · INVESTOR LETTERS
#  This is the only file you need to edit.
#
#  To ADD a manager: copy one block (from "- id:" down to the
#  next "- id:"), paste it at the end and change the values.
#  To REMOVE a manager: delete its block. Its letters stay in
#  the archive file but stop showing on the site.
#  To EDIT your comment: change the text after "why:".
#  "best_for" says which kind of investor gets the most out of the letters.
#
#  Keep the two spaces of indentation. Text with a colon (:)
#  inside must go between double quotes.
# ─────────────────────────────────────────────────────────────

managers:

  - id: brookfield              # short name for the web address, lowercase, no spaces
    name: Bruce Flatt
    firm: Brookfield Corporation
    style: "Real assets and alternatives: infrastructure, renewables, real estate, private equity and credit."
    why: "Every quarter the CEO of Brookfield Corporation explains where private capital is going and what it pays for. The archive goes back to 2012."
    best_for: "Investors in real assets, infrastructure and the business of alternative asset management."
    letters_page: https://bn.brookfield.com/reports-filings/letters-to-shareholders
    access: open                # open | registration
    scrape:                     # brookfield.com blocks automated visits; new letters come from SEC EDGAR
      source: edgar
      cik: 1001085
      title: "{label} letter (in the interim report)"
    overrides:                  # fix a letter the script dated wrong
      - match: "march-final"
        period: Q1 2025
        title: "Special letter, March 2025"
      - match: "2023 Summary and Update"
        title: "2023 summary and update"

  - id: hayden
    name: Fred Liu
    firm: Hayden Capital
    style: "Concentrated \"emerging compounders\", mostly internet platforms and marketplaces, many outside the US."
    why: "Deep business-model work on marketplaces and e-commerce (Sea, Pinduoduo, MercadoLibre). Worth reading even if you never own the stocks."
    best_for: "Growth-minded investors who want deep work on internet platforms and marketplaces."
    letters_page: https://haydencapital.com/
    access: open
    scrape:
      select: '.document-thumbnail[data-year]'
      url_attr: data-external-link, data-pdf-url    # first one that exists wins
      period_attrs: [data-year, data-quarter]

  - id: 1-main
    name: Yaron Naymark
    firm: 1 Main Capital
    style: "Concentrated, long-biased value in small caps knocked down by non-fundamental selling."
    why: "Yaron says no to most ideas and sizes up the few that pass. Each letter explains why a stock is on sale and what has to happen for the market to see it."
    best_for: "Small-cap investors who like buying good businesses while others are forced to sell."
    letters_page: https://www.1maincapital.com/materials
    access: open
    scrape:
      select: 'a[href$=".pdf"]'
      url_attr: href
      period_from: text
      include: 'letter'          # only links whose text or address contains this word

  - id: rv-capital
    name: Rob Vinall
    firm: RV Capital
    style: "Business Owner Fund: about 10 to 12 owner-operated businesses held for the long term."
    why: "Rob puts management character at the center of every decision and is candid about drawdowns, including a near-50% one."
    best_for: "Long-term investors focused on quality businesses run by owner-operators."
    letters_page: https://www.rvcapital.ch/articles-en
    access: registration        # the site shows a note and a link, no individual letters

  - id: wedgewood
    name: David Rolfe
    firm: Wedgewood Partners
    style: "Focused, low-turnover growth portfolios in large and SMID caps, owned like businesses."
    why: "Dave pairs holding-by-holding notes with blunt commentary on the Fed and valuations, and follows the same companies for years."
    best_for: "Investors in large-cap quality growth who hold for years."
    letters_page: https://wedgewoodpartners.com/investor-resources/
    access: open
    scrape:                     # the page only shows the newest letter; the archive below is manual
      select: 'a[href*="/wp-content/uploads/"][href$=".pdf"]'
      url_attr: href
      period_from: text
    letters:
      - {period: Q1 2016, url: "https://web.archive.org/web/20221021014934/http://media.wix.com/ugd/5bfe4b_1ea5b1df87b94c84a3eb545789442b3c.pdf"}
      - {period: Q2 2016, url: "https://web.archive.org/web/20221021014905/http://media.wix.com/ugd/5bfe4b_d18a091439a6474bbcd5f95e55585067.pdf"}
