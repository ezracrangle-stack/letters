name: EDGAR check (one-off)
on:
  push:
    paths: [scripts/edgar_check.py]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python scripts/edgar_check.py
