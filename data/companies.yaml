# Companies the site tracks in the letters.
# name: how it shows on the site. aliases: other ways letters write it.
# Left out on purpose: names letters use as data sources or contact links (FactSet, Bloomberg, Twitter, LinkedIn) or meeting tools (Zoom).
# exclude: a regex; a name that matches it doesn't count (e.g. "Sage of Omaha" is Buffett, not Sage).
# Only names and counts come from the letters; their text is never stored.
# Only companies that still exist on their own. Names that went bankrupt, were bought
# or were renamed (Enron, Wachovia, Slack, Sun Microsystems...) stay out.

